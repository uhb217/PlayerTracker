plugins {
	id 'fabric-loom' version '1.17.21'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom provides mavenCentral() and the Fabric maven automatically.
	// (LibGui was removed: its old CottonMC maven host no longer exists,
	//  and the GUI was rewritten with vanilla widgets.)
}

loom {
    splitEnvironmentSourceSets()

	mods {
		"playertracker" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	mixin {
		// Modern Fabric API ships refmap-less mixins; inline their targets when
		// remapping dependencies so runClient (named mappings) can apply them.
		inlineDependencyRefmaps.set(true)
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "com.ptsmods:devlogin:3.4.1"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}